# Installed only as /www/server/panel/vhost/nginx/lh.qlf3.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name lh.qlf3.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Lighthouse deployment is being prepared.\n";
    }
}
