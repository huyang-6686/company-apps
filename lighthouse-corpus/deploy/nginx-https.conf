# Managed by the existing BaoTa Nginx only; no second Nginx service.
server {
    listen 80;
    listen [::]:80;
    server_name lh.qlf3.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://lh.qlf3.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lh.qlf3.com;
    ssl_certificate /etc/letsencrypt/live/lh.qlf3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lh.qlf3.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    access_log /www/wwwlogs/lighthouse-corpus.access.log;
    error_log /www/wwwlogs/lighthouse-corpus.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
